<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151b2b">
  <title>Two of Us · Game Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">TWO OF US / GAME LAB</span><h1>Find your kind of fun.</h1><p>Three tiny experiments in working together.</p></header>
    <nav aria-label="Choose a game">
      <button data-game="signal" class="selected">01 Signal Room</button>
      <button data-game="map">02 Two Sides</button>
      <button data-game="pulse">03 In Sync</button>
    </nav>
    <section class="game" aria-labelledby="game-title">
      <div class="topline"><span id="tag"></span><button id="reset" class="quiet">New round ↻</button></div>
      <h2 id="game-title"></h2><p id="intro"></p>
      <div id="board"></div>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
    <aside><strong>Prototype mode</strong><p>No accounts or networking. Signal Room and Two Sides let you peek at your partner’s information; In Sync has a simulated partner. All rounds are generated locally.</p></aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
